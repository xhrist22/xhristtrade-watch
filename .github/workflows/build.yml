name: Wear APK → Telegram

# Builds the Galaxy Watch (Wear OS) debug APK and DMs it via @xhrist22_bot.
# The APK is debug-signed — installable with Wear Installer 2 (no keystore needed).
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   QT_WATCH_KEY  — the watch viewer code         (REQUIRED)
#   TG_BOT_TOKEN  — a Telegram bot token           (REQUIRED to DM)
#   TG_CHAT_ID    — your Telegram DM id             (REQUIRED to DM)
#   QT_BASE_URL   — optional (default https://xhristtrade.com)
#   QT_PHONE_URL  — optional (default https://terminal.xhristtrade.com)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the action's default "tools" package was removed from Google's repo and breaks the step;
          # install exactly what compileSdk 34 needs instead
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Bootstrap the Gradle wrapper
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.7/bin/gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Decode the stable signing keystore
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > xt.keystore && echo "keystore decoded"; else echo "no keystore secret — default debug signing"; fi

      - name: Build debug APK
        env:
          BASE_URL: ${{ secrets.QT_BASE_URL }}
          WATCH_KEY: ${{ secrets.QT_WATCH_KEY }}
          PHONE_URL: ${{ secrets.QT_PHONE_URL }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # 🔐 _WATCH_APK_NOT_PUBLIC_2026_10_23 — this repo is PUBLIC and the APK carries the watch key compiled in (BuildConfig), so a
      # build artifact let any GitHub user download it and pull the key out. The APK is NEVER a public artifact; it goes only to two
      # PRIVATE channels: Sam's Telegram DM (next step), and — for adb installs — Sam's own VPS over a locked-down deploy key (step after).

      - name: DM the APK to Telegram
        if: ${{ success() }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "no apk found"; exit 1; fi
          if [ -z "${{ secrets.TG_BOT_TOKEN }}" ] || [ -z "${{ secrets.TG_CHAT_ID }}" ]; then
            echo "TG secrets not set — skipping send (APK is in the artifact)."; exit 0
          fi
          curl -sS --fail \
            -F document=@"$APK" \
            -F caption="⌚ XhristTrade Watch · build #${{ github.run_number }} · install with Wear Installer 2" \
            "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TG_CHAT_ID }}"

      # 🚚 _WATCH_APK_TO_VPS_2026_10_23 — ALSO drop the APK to Sam's PRIVATE VPS so Claude can `adb install` it (GitHub no longer serves it).
      # VPS_SSH_KEY is a FORCED-COMMAND key: `restrict,command="cat > /root/qt/watch-apk/app-debug.apk"` — it can ONLY overwrite that one
      # private file (outside the nginx web root), nothing else, even if the secret leaked. This is a private channel, so it honors
      # _WATCH_APK_NOT_PUBLIC (the APK is never a downloadable artifact). This step does NOT affect the Telegram DM above — both always run.
      - name: Deliver the APK to the private VPS (for adb installs)
        if: ${{ success() }}
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then echo "VPS secrets not set — skipping VPS drop (Telegram DM still sent)"; exit 0; fi
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "no apk found"; exit 1; fi
          printf '%s\n' "$KEY" > dkey && chmod 600 dkey
          cat "$APK" | ssh -i dkey -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes "$USER@$HOST" deliver-apk && echo "APK delivered to private VPS (/root/qt/watch-apk/app-debug.apk)"
          shred -u dkey 2>/dev/null || rm -f dkey
